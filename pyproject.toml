[project]
name = "pipeline"
dynamic = [
  "version"
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "matplotlib>=3.11.0",
    "matplotlib-scalebar>=0.9.0",
    "mpl-tools>=0.4.3",
    "nd2[legacy]>=0.11.3",
    "pathspec>=1.1.1",
    "ruff>=0.15.20",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tifffile>=2026.6.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' or sys_platform == 'linux'"
]

[tool.ty.src]
include = ["src"]
exclude = [
    "src/spideymaps/**",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
output-format = "concise"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.1.2",
    "python-lsp-server>=1.14.0",
    "ty>=0.0.73",
]

[project.scripts]
quant = "src.quant.main:main"
finalize = "src.finalize.main:main"
